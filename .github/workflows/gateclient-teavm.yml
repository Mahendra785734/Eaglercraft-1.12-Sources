name: GateClient Eaglercraft build

on:
  push:
    branches:
      - gateclient-1.6-eagler-port
  workflow_dispatch:

jobs:
  build-offline-client:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Eaglercraft assets
        run: java -jar desktopRuntime/CompileEPK.jar desktopRuntime/resources javascript/assets.epk
      - name: Compile TeaVM client
        run: |
          chmod +x gradlew
          ./gradlew generateJavascript --no-daemon
      - name: Package offline HTML
        run: java -cp "desktopRuntime/MakeOfflineDownload.jar:desktopRuntime/CompileEPK.jar" net.lax1dude.eaglercraft.v1_8.buildtools.workspace.MakeOfflineDownload javascript/OfflineDownloadTemplate.txt javascript/classes.js javascript/assets.epk javascript/Eaglercraft_1.12_Offline_en_US.html javascript/Eaglercraft_1.12_Offline_International.html javascript/lang
      - name: Upload playable offline clients
        uses: actions/upload-artifact@v4
        with:
          name: gateclient-eaglercraft-offline-html
          path: |
            javascript/Eaglercraft_1.12_Offline_en_US.html
            javascript/Eaglercraft_1.12_Offline_International.html
          if-no-files-found: error
